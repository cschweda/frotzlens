<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- frotztrace social card. Same system as frotzlens's: dark ground, amber glow, an amber
       instrument tile, a serif wordmark, the subject's own material as faint texture.
       Render: rsvg-convert -w 1200 -h 630 og-image.svg -o og-image.png (moves to apps/trace/public/ in Phase 4) -->
  <defs>
    <radialGradient id="glow" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="630" fill="#0b0b0e"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Texture: a paused machine, one turn's instructions, the program counter on one line -->
  <rect x="628" y="263" width="572" height="34" fill="#f59e0b" fill-opacity="0.07"/>
  <g font-family="'Courier New', Courier, monospace" font-size="23" fill="#23232b" xml:space="preserve">
    <text x="640" y="118">turn 12   &gt; take key</text>
    <text x="640" y="186">  27f8  CALL_VS    R0344 (#32,#01) -&gt; sp</text>
    <text x="640" y="220">  2801  JZ         sp [FALSE] 2810</text>
    <text x="640" y="254">  2805  TEST_ATTR  L01,#0b [TRUE] 2812</text>
    <text x="640" y="288" fill="#3a3226">&#9656; 2809  INSERT_OBJ L01,G00</text>
    <text x="640" y="322">  280c  PRINT      "Taken."</text>
    <text x="640" y="356">  2811  RTRUE</text>
    <text x="640" y="424">watch  score    4 &#8594; 5</text>
    <text x="640" y="458">break  Take (action)</text>
    <text x="640" y="526" fill="#2c2c34">[paused: step back available]</text>
  </g>

  <!-- Instrument mark: a stepped trace under a playhead, in an amber tile -->
  <rect x="90" y="212" width="158" height="158" rx="34" fill="url(#amber)"/>
  <g transform="translate(110,238) scale(4.9)" fill="none" stroke="#0b0b0e" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0.6 17 H4.4 V9.5 H8.6 V14 H12.8 V5 H17 V11.5 H23.4" stroke-width="2"/>
    <path d="M12.8 1.2 V20.6" stroke-width="1.2" stroke-dasharray="1.4 1.6" opacity="0.7"/>
    <circle cx="12.8" cy="5" r="1.9" fill="#0b0b0e" stroke="none"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="286" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="98" font-weight="700" fill="#f5f3ee">frotztrace</text>
  <text x="290" y="352" font-size="33" fill="#a8a29e">Step through a Z-machine story, backwards too</text>
  <text x="290" y="406" font-family="'Courier New', Courier, monospace" font-size="26" fill="#fbbf24">&gt; run &#183; break &#183; watch &#183; step back</text>

  <!-- Footer rule + tags -->
  <rect x="92" y="556" width="1016" height="2" fill="#1c1c22"/>
  <text x="92" y="596" font-family="'Courier New', Courier, monospace" font-size="22" fill="#6b6b72">Z-machine v3 &#183; v4 &#183; v5 &#183; v8 &#183; Inform 6 source &#183; a debugger &#183; in the browser</text>
</svg>

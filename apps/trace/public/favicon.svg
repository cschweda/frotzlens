<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>frotztrace</title>
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#a)"/>
  <!-- An instrument: a stepped trace under a playhead (the program counter, stopped on a step). The
       og-image's mark, on the family's 24-unit grid, as frotzsmith's hammer, frotzlens's loupe and
       frotzplay's prompt. -->
  <g transform="translate(106,106) scale(12.5)" fill="none" stroke="#0b0b0e" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0.6 17 H4.4 V9.5 H8.6 V14 H12.8 V5 H17 V11.5 H23.4" stroke-width="2"/>
    <path d="M12.8 1.2 V20.6" stroke-width="1.2" stroke-dasharray="1.4 1.6" opacity="0.7"/>
    <circle cx="12.8" cy="5" r="1.9" fill="#0b0b0e" stroke="none"/>
  </g>
</svg>

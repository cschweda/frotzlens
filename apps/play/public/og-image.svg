<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="630" fill="#0b0b0e"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- The subject's own material: a session of The Dark Cellar, faint, as texture, clear of the text -->
  <g font-family="'Courier New', Courier, monospace" font-size="23" fill="#23232b" xml:space="preserve">
    <text x="700" y="62" fill="#2c2c34">&gt; take lantern</text>
    <text x="700" y="96">Taken.</text>
    <text x="700" y="140" fill="#2c2c34">&gt; turn on lantern</text>
    <text x="700" y="174">You switch the brass lantern on.</text>
    <text x="700" y="456" fill="#2c2c34">&gt; down</text>
    <text x="700" y="490">Cellar</text>
    <text x="700" y="524">A damp stone cellar.</text>
  </g>

  <!-- Play mark: the prompt as a play triangle, with the cursor beside it, in an amber tile -->
  <rect x="90" y="212" width="158" height="158" rx="34" fill="url(#amber)"/>
  <g transform="translate(110,232) scale(4.9)" fill="#0b0b0e">
    <path d="M3.2 4.2 Q3.2 2.6 4.6 3.4 L14.4 10.6 Q15.6 11.5 14.4 12.4 L4.6 19.6 Q3.2 20.4 3.2 18.8 Z"/>
    <rect x="16.8" y="16.6" width="5.2" height="2.6" rx="0.6"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="286" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="98" font-weight="700" fill="#f5f3ee">frotzplay</text>
  <text x="290" y="352" font-size="33" fill="#a8a29e">Play Z-machine stories in your browser</text>
  <text x="290" y="406" font-family="'Courier New', Courier, monospace" font-size="26" fill="#fbbf24">&gt; screen readers first &#183; strict CSP &#183; no uploads</text>

  <!-- Footer rule + tags -->
  <rect x="92" y="556" width="1016" height="2" fill="#1c1c22"/>
  <text x="92" y="596" font-family="'Courier New', Courier, monospace" font-size="22" fill="#6b6b72">Z-machine v3 &#183; v4 &#183; v5 &#183; v8 &#183; Quetzal saves &#183; WCAG 2.2 AA &#183; in the browser</text>
</svg>

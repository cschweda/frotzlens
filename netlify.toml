# Netlify configuration for frotzlens (frotzlens.frotzinc.com).
# A static Nuxt 4 app (ssr: false) in a pnpm monorepo. The site is apps/web;
# it depends on the workspace libraries (@frotzinc/zcode, …), which are built
# first. On Netlify, Nitro's Netlify preset writes the static site to `dist`
# (there is no .output/public there — frotzsmith's builds broke on that
# assumption on 2026-11-04), so `dist` is what's published. Paths below are
# relative to `base`.
#
# Connect the repo in the Netlify UI with base directory `apps/web` — the
# rest is read from this file.

[build]
  base = "apps/web"
  # Skip the build when a push changes nothing frotzlens is built from, so a README-, docs-,
  # frotzplay- or frotztrace-only merge doesn't redeploy frotzlens (each production deploy costs
  # credits). Netlify skips when this exits 0 and builds otherwise. The paths, relative to `base`:
  # this app; the libraries it is built from (zcode, zcode-ui, worker-rpc, nuxt-base, inform6-wasm);
  # what it reads from the repository (the samples, the root CHANGELOG.md for What's new, this
  # file's headers, and the CLI's package.json for the About menu's versions); and the workspace
  # files that decide how they build. Add a path here when apps/web starts depending on another.
  # The first test always builds when there is no previous deploy to compare with (Netlify sets
  # CACHED_COMMIT_REF to COMMIT_REF then).
  ignore = "test \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" && exit 1; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ../../packages/zcode ../../packages/zcode-ui ../../packages/worker-rpc ../../packages/nuxt-base ../../packages/inform6-wasm ../../packages/cli/package.json ../../samples ../../CHANGELOG.md ../../netlify.toml ../../package.json ../../pnpm-lock.yaml ../../pnpm-workspace.yaml ../../tsconfig.base.json"
  # Netlify runs its own `pnpm install` first; the frozen install keeps a
  # drifted lockfile from being rewritten (and passing). Then build the
  # libraries the app depends on (`^...` = its workspace dependencies, not
  # the app itself), then generate the static site.
  command = "pnpm install --frozen-lockfile && pnpm --filter \"frotzlens-web^...\" run build && pnpm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile"

# Custom redirects belong in apps/web/public/_redirects: Nitro's netlify preset
# emits its own `_redirects` catch-all that shadows [[redirects]] blocks here.

# Security headers. frotzlens loads nothing from another origin: no analytics,
# no CDN, fonts self-hosted, and a dropped story file is read locally and
# never uploaded — so everything is 'self'.
#  - 'unsafe-inline' (scripts): Nuxt's inline SPA bootstrap and the color-mode
#    script; (styles): Nuxt UI's inline styles.
#  - img-src blob: a Blorb cover image is shown from a blob URL.
#  - frame-src 'self': the Play view embeds the player (/play/), below.
#  - 'wasm-unsafe-eval': the Source view's worker runs Inform 6.44 in WebAssembly
#    (@frotzinc/inform6-wasm) to check the decompiled source; nothing else does.
# Checked in Phase 3: the built site, served with exactly this header, loads,
# parses a story in its Web Worker and opens the palette with no violations.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# The player (/play/: vendored Parchment, apps/web/public/play/). It overrides the rules above for
# its own pages (later rules override earlier ones on Netlify):
#  - 'unsafe-eval' (scripts): ZVM compiles each story's Z-code to JavaScript as it runs. Only here;
#    the app itself never gets it. No 'unsafe-inline': the page's own script is play.js.
#  - connect-src blob:: Parchment fetches the story from a blob URL the page makes itself.
#  - frame-ancestors 'self' / SAMEORIGIN: only frotzlens may embed it. The app embeds it in a
#    sandboxed iframe (no allow-same-origin), so the game runs in an opaque origin, cut off from the
#    app and its storage: a story is anyone's file.
#  - Access-Control-Allow-Origin *: that opaque origin loads Parchment's module scripts, and a module
#    from another origin needs CORS. These are public static files, the same for everyone.
[[headers]]
  for = "/play/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Access-Control-Allow-Origin = "*"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; worker-src 'none'; frame-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none'"

# Long-cache content-hashed build assets.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# EXCEPT Nuxt's app manifest (builds/latest.json, builds/meta/<id>.json): it
# is unfingerprinted and must never be immutable-cached. (Later rules override
# earlier ones on Netlify.)
[[headers]]
  for = "/_nuxt/builds/*"
  [headers.values]
    Cache-Control = "no-cache"

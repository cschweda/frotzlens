# CI for the frotzlens monorepo: every push and pull request, and every release
# tag (@frotzinc/<name>@<version>, or frotzlens@<version> for the CLI). publish.sh refuses to publish a version
# whose tag's run of this workflow didn't pass.
name: ci

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # the version comes from package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: packages typecheck and test against their dependencies' dist/
      # (the CLI against @frotzinc/zcode, zcode's fixtures against inform6-wasm).
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # frotzplay's player: the accessibility contract (docs/accessibility.md) in three browsers.
      - run: pnpm --filter @frotzinc/player exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @frotzinc/player run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: player-contract-results
          path: packages/player/test-results/
          retention-days: 7
      # frotzplay's site (apps/play): typecheck, generate as Netlify does, and test the built site,
      # served with its netlify.toml headers, in three browsers (docs/14).
      - run: pnpm --filter frotzplay-web run typecheck
      - run: pnpm --filter frotzplay-web run generate
      - run: pnpm --filter frotzplay-web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frotzplay-site-results
          path: apps/play/test-results/
          retention-days: 7
      # The web app (apps/web): typecheck it and generate the static site, as Netlify does.
      - run: pnpm --filter frotzlens-web run check:vendored
      - run: pnpm --filter frotzlens-web run typecheck
      - run: pnpm --filter frotzlens-web run generate
      # The smoke test (Phase 4): every view of a real story, axe on each, against the built site.
      - run: pnpm --filter frotzlens-web exec playwright install --with-deps chromium
      - run: pnpm --filter frotzlens-web run test:e2e
      # A failed smoke test leaves its traces (open with `npx playwright show-trace`).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
